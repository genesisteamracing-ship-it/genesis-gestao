name: CI - Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stem-erp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stem-erp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint -- --quiet

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

  unit-tests:
    name: Automated Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stem-erp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stem-erp/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests
        run: npm test

  build-verification:
    name: Production Build Verification
    needs: [lint-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stem-erp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stem-erp/package-lock.json

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: stem-erp/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('stem-erp/package-lock.json') }}-${{ hashFiles('stem-erp/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('stem-erp/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci_dummy:ci_dummy@localhost:5432/ci_db?sslmode=disable"
          DATABASE_URL_UNPOOLED: "postgresql://ci_dummy:ci_dummy@localhost:5432/ci_db?sslmode=disable"
          AUTH_SECRET: "ci-dummy-jwt-secret-key-min-32-chars-long"
          NODE_ENV: production

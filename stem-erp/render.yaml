# Render Blueprint Specification (caso o repositório Git seja apenas a pasta stem-erp)
# Documentação: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: stem-racing-erp
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /api/metrics
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEON_BRANCH
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Cole aqui a URL Pooled do Neon (presente no seu .env.local)
      - key: DATABASE_URL_UNPOOLED
        sync: false # Cole aqui a URL Direct/Unpooled do Neon (presente no seu .env.local)
